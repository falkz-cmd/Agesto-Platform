name: Bug
description: Relate um comportamento incorreto ou regressão
title: "[Bug]: "
labels: ["bug"]
body:
  - type: dropdown
    id: module
    attributes:
      label: Módulo
      options: [Backend, Web, Mobile, Sincronização, Infraestrutura, Documentação]
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Comportamento observado
      description: Descreva o que aconteceu e o impacto.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Comportamento esperado
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Como reproduzir
      description: Inclua usuário/perfil, dados mínimos e sequência de ações sem expor dados sensíveis.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidências
      description: Logs sanitizados, screenshots, plataforma e versão.
  - type: checkboxes
    id: safety
    attributes:
      label: Segurança
      options:
        - label: Confirmei que a issue não contém token, senha, CPF real ou connection string.
          required: true
